<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a light for you</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --dusk-deep: #0b1f1a;
    --dusk-indigo: #111b2e;
    --moss: #4e7a5e;
    --firefly: #f5c24c;
    --firefly-soft: #ffd37a;
    --paper: #f2efe4;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 20%, var(--dusk-indigo) 0%, var(--dusk-deep) 65%, #060f0c 100%);
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  #fireflies {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .firefly {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--firefly);
    box-shadow: 0 0 6px 2px var(--firefly-soft), 0 0 14px 6px rgba(245, 194, 76, 0.35);
    animation: drift linear infinite, flicker ease-in-out infinite;
  }

  @keyframes drift {
    from { transform: translate(0, 0); }
    to   { transform: translate(var(--dx), var(--dy)); }
  }

  @keyframes flicker {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
  }

  main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-optical-sizing: auto;
    font-size: clamp(26px, 4vw, 38px);
    color: var(--paper);
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }

  .subtitle {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--moss);
    margin-bottom: 22px;
    opacity: 0.9;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--moss);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--firefly);
    box-shadow: 0 0 8px 2px rgba(245, 194, 76, 0.6);
    animation: flicker 2.4s ease-in-out infinite;
  }

  .frame {
    width: min(920px, 92vw);
    border-radius: 14px;
    padding: 10px;
    background: linear-gradient(160deg, rgba(78, 122, 94, 0.25), rgba(11, 31, 26, 0.4));
    border: 1px solid rgba(245, 194, 76, 0.18);
    box-shadow: 0 0 60px rgba(245, 194, 76, 0.08), 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  video {
    width: 100%;
    display: block;
    border-radius: 8px;
    background: #000;
  }

  .offline {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--paper);
    opacity: 0.85;
    padding: 60px 24px;
  }

  .offline span {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--moss);
    margin-top: 10px;
    font-style: normal;
  }
</style>
</head>
<body>

<div id="fireflies"></div>

<main>
  <h1>come sit with me a while</h1>
  <div class="subtitle">i left the light on for you</div>
  <div class="status"><span class="dot"></span><span id="status-text">getting comfy&hellip;</span></div>
  <div class="frame">
    <video id="video" controls playsinline></video>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
  // Drifting fireflies (background)
  const field = document.getElementById('fireflies');
  const COUNT = 22;
  for (let i = 0; i < COUNT; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    const startX = Math.random() * 100;
    const startY = Math.random() * 100;
    const dx = (Math.random() - 0.5) * 200;
    const dy = (Math.random() - 0.5) * 160;
    const duration = 14 + Math.random() * 18;
    const flickerDuration = 2 + Math.random() * 3;
    f.style.left = startX + 'vw';
    f.style.top = startY + 'vh';
    f.style.setProperty('--dx', dx + 'px');
    f.style.setProperty('--dy', dy + 'px');
    f.style.animationDuration = duration + 's, ' + flickerDuration + 's';
    f.style.animationDelay = (Math.random() * -duration) + 's, ' + (Math.random() * -flickerDuration) + 's';
    field.appendChild(f);
  }

  // Video playback
  const streamUrl = 'https://stream.leahcrhunter.com/mystream/live/index.m3u8';
  const video = document.getElementById('video');
  const statusText = document.getElementById('status-text');

  function showOffline() {
    statusText.textContent = 'not here yet';
    document.querySelector('.frame').innerHTML =
      '<div class="offline">nothing to see just yet<span>i\'ll light this up the moment i am 💛 come back soon</span></div>';
  }

  if (Hls.isSupported()) {
    // Stay close to live: a hiccup's lost seconds get caught up (sped up a
    // little, or a jump back to live if it's drifted far), rather than kept.
    const hls = new Hls({
      lowLatencyMode: true,
      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 6,
      maxLiveSyncPlaybackRate: 1.5,
    });
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      statusText.textContent = 'i\'m here';
      video.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) showOffline();
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;
    video.addEventListener('loadedmetadata', () => {
      statusText.textContent = 'i\'m here';
      video.play().catch(() => {});
    });
    video.addEventListener('error', showOffline);
    // Safari plays HLS itself and never catches up, so jump back to live
    // if it's fallen well behind.
    setInterval(() => {
      if (video.paused || !video.seekable.length) return;
      const live = video.seekable.end(video.seekable.length - 1);
      if (live - video.currentTime > 15) video.currentTime = live - 3;
    }, 5000);
  } else {
    showOffline();
  }

  // --- Check-ins, for logs.leahcrhunter.com ---
  // (The "firefly" storage keys are from the old viewer jar; kept so browsers
  // that already have a device id keep it.)
  let sessionId = sessionStorage.getItem('fireflySessionId');
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    sessionStorage.setItem('fireflySessionId', sessionId);
  }
  // Same for every tab in this browser, so the logs can tell computers apart.
  let deviceId = null;
  try {
    deviceId = localStorage.getItem('fireflyDeviceId');
    if (!deviceId) {
      deviceId = crypto.randomUUID();
      localStorage.setItem('fireflyDeviceId', deviceId);
    }
  } catch (e) {}

  async function heartbeat() {
    try {
      const res = await fetch('/watch/heartbeat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: sessionId, device: deviceId }),
      });
      if (res.status === 401) location.assign('/login'); // signed out in another tab
    } catch (e) {}
  }

  function leave() {
    const payload = JSON.stringify({ id: sessionId });
    navigator.sendBeacon('/watch/leave', new Blob([payload], { type: 'application/json' }));
  }

  window.addEventListener('pagehide', leave);
  window.addEventListener('beforeunload', leave);

  heartbeat();
  setInterval(heartbeat, 20000);
</script>

</body>
</html>
