<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>kitchen</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0d1026" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kitchen" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body class="login-page ready">

  <canvas id="fireflies" aria-hidden="true"></canvas>
  <div class="top"><svg id="lights" class="lights" aria-hidden="true"></svg></div>

  <main class="login">
    <svg class="login-jar" viewBox="0 0 64 64" aria-hidden="true">
      <defs><filter id="jarGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter></defs>
      <path d="M24 14 C24 6, 40 6, 40 14" stroke="#c9c2ad" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <rect x="21" y="10" width="22" height="7" rx="2.5" fill="#8a6a3f" stroke="#5f4a2a" stroke-width="1"/>
      <rect x="21" y="10" width="22" height="2.4" rx="1.2" fill="#a9865a"/>
      <rect x="23" y="16" width="18" height="7" fill="rgba(244,238,224,0.08)" stroke="rgba(244,238,224,0.35)" stroke-width="1"/>
      <path d="M17 23 H47 V47 C47 54.5, 40.7 58 32 58 C23.3 58, 17 54.5, 17 47 Z" fill="rgba(244,238,224,0.07)" stroke="rgba(244,238,224,0.4)" stroke-width="1.3"/>
      <path d="M22 27 L22 49" stroke="rgba(244,238,224,0.25)" stroke-width="2" stroke-linecap="round"/>
      <circle class="login-glow" cx="32" cy="41" r="9" fill="#f4d58d" opacity="0.6" filter="url(#jarGlow)"/>
      <circle cx="32" cy="41" r="3.4" fill="#fff4d6"/>
    </svg>
    <h1>kitchen</h1>
    <p class="login-sub">what we have, what to cook, what to buy</p>

    <form method="post" action="/login" class="login-form">
      <label for="password" class="visually-hidden">password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="password" required autofocus />
      <button class="btn btn-primary">come in</button>
    </form>
    <p class="login-error" id="error" role="alert"></p>
  </main>

  <script type="module">
    import { fairyLights, fireflies } from "/js/ambient.js";
    fairyLights(document.getElementById("lights"));
    fireflies(document.getElementById("fireflies"), { count: 18 });
    const messages = {
      wrong: "not quite. try again?",
      wait: "too many tries. give it fifteen minutes.",
      setup: "the password isn't set up yet (see sites/kitchen/README.md).",
    };
    const e = new URLSearchParams(location.search).get("e");
    if (messages[e]) document.getElementById("error").textContent = messages[e];
  </script>
</body>
</html>
